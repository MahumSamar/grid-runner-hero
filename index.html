<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Runner — Unplug the Hero</title>
<meta name="description" content="Draw to reveal the kid behind the Grid Runner helmet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,500..900&family=Outfit:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260930_032112_83df5417-b938-40cb-ab08-277e681c0058.png">
<link rel="preload" as="image" href="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260930_032107_cf0bca78-1a51-492b-8607-1303fcc44eb7.png">
<link rel="preload" as="image" href="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260930_032109_4f2b4ad4-61bb-4a4a-8662-bdf3a12d757b.png">
<style>
  :root{
    --bg:#05060d;
    --ink:#ffffff;
    --muted:rgba(226,230,245,.72);
    --violet:#6c4bff;
    --violet-2:#8a6bff;
    --cyan:#35d3ff;
    --line:rgba(255,255,255,.88);
    /* design was drawn on a 2000px-wide 16:9 canvas → 1 --s = 20 design px */
    --s:min(1vw, 1.78vh);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink)}
  body{font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ───────── HERO SECTION ───────── */
  .hero{
    position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;
    overflow:hidden;background:var(--bg);isolation:isolate;
    touch-action:none;user-select:none;-webkit-user-select:none;
    cursor:crosshair;
  }
  .hero a,.hero button{cursor:pointer}

  .layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  /* stack: background plate → shading → graffiti → transparent hero (front/back) → sparks → UI */
  #bg{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;pointer-events:none;opacity:0;transition:opacity .9s ease}
  #front{z-index:4;opacity:0;transition:opacity .9s ease .15s}
  .ready #bg,.ready #front{opacity:1}
  #sparks{z-index:5;mix-blend-mode:screen}

  /* legibility shading */
  .shade{z-index:2;background:
      radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(5,6,13,.55) 100%),
      linear-gradient(90deg, rgba(5,6,13,.55) 0%, rgba(5,6,13,0) 34%),
      linear-gradient(0deg, rgba(5,6,13,.55) 0%, rgba(5,6,13,0) 18%);
  }

  /* graffiti tag */
  .tag{
    position:absolute;z-index:3;left:4.6%;top:63%;
    font-family:"Permanent Marker",cursive;font-size:calc(var(--s)*7.1);
    line-height:1;letter-spacing:-.045em;word-spacing:-.05em;white-space:nowrap;
    color:rgba(128,136,158,.6);
    rotate:-10deg;scale:1 1.85;transform-origin:left center;
    pointer-events:none;
    filter:drop-shadow(0 0 1px rgba(0,0,0,.4));
  }
  .tag .glow{
    color:#56dcff;
    text-shadow:0 0 calc(var(--s)*.6) rgba(53,211,255,.9),0 0 calc(var(--s)*2.2) rgba(53,160,255,.65);
  }
  .tag span{display:inline-block}
  .tag .w-on{transform:translateY(-8%)}

  /* ───────── HEADER ───────── */
  header{
    position:absolute;z-index:10;left:0;right:0;top:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(var(--s)*1.6) calc(var(--s)*2.8) 0 calc(var(--s)*3.2);
  }
  .logo{display:flex;align-items:center;gap:calc(var(--s)*1.1);font-weight:700;font-size:calc(var(--s)*1.85);letter-spacing:-.02em}
  .logo svg{width:calc(var(--s)*2.5);height:calc(var(--s)*3.9);filter:drop-shadow(0 0 calc(var(--s)*.5) rgba(124,92,255,.7))}
  nav.pills{position:absolute;left:50%;top:calc(var(--s)*1.9);transform:translateX(-50%);display:flex;gap:calc(var(--s)*.85)}
  nav.pills a{
    display:grid;place-items:center;height:calc(var(--s)*2.85);min-width:calc(var(--s)*5.7);
    padding:0 calc(var(--s)*1.6);border:calc(var(--s)*.1) solid var(--line);border-radius:999px;
    font-size:calc(var(--s)*1.05);font-weight:500;letter-spacing:.005em;
    background:rgba(5,6,13,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background .25s,color .25s,border-color .25s,transform .25s;
  }
  nav.pills a:hover,nav.pills a.on{background:#fff;color:#07080f}
  .actions{display:flex;align-items:center;gap:calc(var(--s)*1.5)}
  .grid-btn{
    width:calc(var(--s)*3.5);height:calc(var(--s)*3.5);border-radius:50%;
    border:calc(var(--s)*.1) solid rgba(255,255,255,.22);background:rgba(10,12,24,.55);
    display:grid;place-items:center;transition:border-color .25s,transform .25s;
  }
  .grid-btn:hover{border-color:var(--violet-2);transform:rotate(45deg)}
  .grid-btn i{display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--s)*.3)}
  .grid-btn i b{width:calc(var(--s)*.5);height:calc(var(--s)*.5);border-radius:50%;background:var(--violet-2);box-shadow:0 0 calc(var(--s)*.4) rgba(138,107,255,.8)}
  .trailer{
    height:calc(var(--s)*3.45);padding:0 calc(var(--s)*2);border-radius:999px;
    font-family:"Archivo",sans-serif;font-weight:600;font-size:calc(var(--s)*1.12);letter-spacing:.02em;text-transform:uppercase;
    background:linear-gradient(180deg,#7a5bff 0%,#5f3ff6 100%);
    box-shadow:0 0 calc(var(--s)*1.6) rgba(108,75,255,.55),inset 0 1px 0 rgba(255,255,255,.25);
    display:flex;align-items:center;gap:calc(var(--s)*.6);transition:transform .25s,box-shadow .25s;
  }
  .trailer:hover{transform:translateY(-2px);box-shadow:0 0 calc(var(--s)*2.6) rgba(108,75,255,.85),inset 0 1px 0 rgba(255,255,255,.3)}

  /* ───────── COPY ───────── */
  .copy{position:absolute;z-index:6;left:calc(var(--s)*3.3);top:calc(var(--s)*12.4);pointer-events:none}
  h1{
    font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;
    font-size:calc(var(--s)*10);line-height:.96;letter-spacing:-.025em;
    text-shadow:0 calc(var(--s)*.3) calc(var(--s)*2) rgba(0,0,0,.35);
  }
  h1 span{display:block}
  .sub{margin-top:calc(var(--s)*1.05);font-size:calc(var(--s)*1.5);font-weight:400;letter-spacing:-.005em;color:#f2f3fa}
  .sub em{font-style:normal;display:inline-block;margin:0 .2em;opacity:.9}

  .foot-l,.foot-r{position:absolute;z-index:6;bottom:calc(var(--s)*2.8)}
  .foot-l{left:calc(var(--s)*2.7);font-size:calc(var(--s)*1.2);color:#e9ebf5}
  .foot-r{right:calc(var(--s)*2.8);font-family:"Archivo",sans-serif;font-weight:800;font-size:calc(var(--s)*1.45);letter-spacing:-.02em;font-stretch:95%}

  /* ───────── CARD ───────── */
  .card{
    position:absolute;z-index:6;right:calc(var(--s)*2.7);top:calc(var(--s)*11);
    width:calc(var(--s)*17.3);aspect-ratio:346/602;border-radius:calc(var(--s)*1.35);overflow:hidden;
    border:calc(var(--s)*.12) solid rgba(170,178,230,.55);
    background:#0a0b17;box-shadow:0 calc(var(--s)*1) calc(var(--s)*3) rgba(0,0,0,.55),0 0 calc(var(--s)*2.4) rgba(108,75,255,.18);
    transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;
  }
  .card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 calc(var(--s)*1.4) calc(var(--s)*3.4) rgba(0,0,0,.6),0 0 calc(var(--s)*3.2) rgba(108,75,255,.4)}
  .card img{position:absolute;inset:0;width:100%;height:78%;object-fit:cover;object-position:50% 28%;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
  .card:hover img{transform:scale(1.06)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,23,0) 44%,rgba(10,11,23,.85) 70%,#0a0b17 80%)}
  .badge{
    position:absolute;z-index:2;left:calc(var(--s)*1.05);top:calc(var(--s)*1.2);
    padding:calc(var(--s)*.42) calc(var(--s)*.85);border-radius:999px;
    border:calc(var(--s)*.1) solid rgba(116,170,255,.65);background:rgba(8,12,34,.75);
    font-family:"Archivo",sans-serif;font-weight:600;font-size:calc(var(--s)*.82);letter-spacing:.01em;color:#9cc4ff;text-transform:uppercase;
  }
  .card-body{position:absolute;z-index:2;left:calc(var(--s)*1.05);right:calc(var(--s)*1);bottom:calc(var(--s)*1.1)}
  .card-body h3{font-family:"Archivo",sans-serif;font-weight:800;font-stretch:92%;font-size:calc(var(--s)*2.05);line-height:.93;letter-spacing:-.02em;text-transform:uppercase}
  .card-body p{margin-top:calc(var(--s)*.55);font-size:calc(var(--s)*1.17);color:rgba(220,224,240,.62)}

  /* ───────── MENU OVERLAY ───────── */
  .menu{
    position:fixed;inset:0;z-index:40;background:rgba(5,6,13,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;
  }
  .menu.open{opacity:1;visibility:visible}
  .menu a{font-family:"Anton",sans-serif;font-size:clamp(40px,9vw,84px);text-transform:uppercase;line-height:1;opacity:.85;transition:color .2s,opacity .2s,transform .2s}
  .menu a:hover{color:var(--cyan);opacity:1;transform:translateX(6px)}
  .menu .close{position:absolute;top:22px;right:22px;width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);font-size:22px;display:grid;place-items:center}

  /* loader */
  .loader{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);transition:opacity .8s ease .2s,visibility .8s ease .2s}
  .ready .loader{opacity:0;visibility:hidden}
  .loader i{width:46px;height:46px;border-radius:50%;border:2px solid rgba(138,107,255,.2);border-top-color:var(--violet-2);animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* entrance */
  .rise{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
  .ready .rise{opacity:1;transform:none}
  .ready .d1{transition-delay:.15s}.ready .d2{transition-delay:.3s}.ready .d3{transition-delay:.45s}.ready .d4{transition-delay:.6s}

  /* ───────── RESPONSIVE ───────── */
  @media (max-width:1180px){
    nav.pills{display:none}
  }
  @media (max-width:820px){
    :root{--s:1vw}
    header{padding:18px 16px 0 16px}
    .logo{font-size:20px;gap:8px}
    .logo svg{width:20px;height:30px}
    .actions{gap:10px}
    .grid-btn{width:44px;height:44px}
    .grid-btn i{gap:4px}
    .grid-btn i b{width:6px;height:6px}
    .trailer{height:44px;padding:0 18px;font-size:13px}
    .copy{left:16px;right:16px;top:clamp(92px,15vh,130px)}
    h1{font-size:clamp(64px,19.5vw,130px)}
    .sub{font-size:clamp(14px,4vw,20px);margin-top:12px}
    .tag{font-size:clamp(24px,7.6vw,60px);left:4%;top:47%}
    /* card becomes a compact strip so it never sits on the face */
    .card{left:16px;right:16px;top:auto;bottom:58px;width:auto;height:88px;aspect-ratio:auto;border-radius:16px;border-width:1.5px;max-width:460px;margin-left:auto}
    .card img{width:36%;height:100%;object-position:50% 34%}
    .card::after{background:linear-gradient(90deg,rgba(10,11,23,0) 22%,#0a0b17 37%)}
    .badge{left:calc(36% + 12px);top:12px;font-size:9.5px;padding:3px 8px;border-width:1px}
    .card-body{left:calc(36% + 12px);right:10px;bottom:12px}
    .card-body h3{font-size:clamp(15px,4.3vw,20px);line-height:1}
    .card-body h3 br{display:none}
    .card-body p{font-size:12px;margin-top:3px}
    .foot-l{left:16px;bottom:24px;font-size:13px}
    .foot-r{right:16px;bottom:24px;font-size:17px}
    .shade{background:
      linear-gradient(180deg, rgba(5,6,13,.7) 0%, rgba(5,6,13,0) 38%),
      linear-gradient(0deg, rgba(5,6,13,.75) 0%, rgba(5,6,13,0) 30%)}
  }
  @media (max-width:350px){
    .trailer span.lbl-long{display:none}
  }
  @media (max-width:820px) and (orientation:landscape) and (max-height:520px){
    .copy{top:70px}
    h1{font-size:15vh}
    .card{display:none}
    .tag{top:52%}
  }
  @media (prefers-reduced-motion:reduce){
    .rise,.card,.card img{transition:none}
  }
</style>
</head>
<body>

<section class="hero" id="hero" aria-label="Grid Runner — draw to reveal">
  <!-- 1. single background plate -->
  <img id="bg" alt="" decoding="async"
       src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260930_032112_83df5417-b938-40cb-ab08-277e681c0058.png">
  <div class="layer shade" aria-hidden="true"></div>

  <!-- 2. graffiti, in code, sitting behind the hero -->
  <div class="tag rise d3" aria-hidden="true">
    <span>THE CITY</span> <span class="glow">RUNS</span> <span class="w-on">ON US</span>
  </div>

  <!-- 3. transparent hero: masked cutout on top, the kid's cutout revealed where you draw -->
  <canvas id="front" class="layer" role="img" aria-label="Grid Runner in his helmet; draw to reveal Jay Okoro underneath"></canvas>

  <canvas id="sparks" class="layer" aria-hidden="true"></canvas>

  <header class="rise">
    <a class="logo" href="#" aria-label="grid runner home">
      <svg viewBox="0 0 26 40" fill="none" aria-hidden="true">
        <defs><linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a6ff"/><stop offset="1" stop-color="#6c4bff"/></linearGradient></defs>
        <path d="M18.5 0 2 23.2h9.4L6.8 40 24 15.6h-9.6L18.5 0Z" fill="url(#bolt)"/>
      </svg>
      grid runner
    </a>
    <nav class="pills" aria-label="Primary">
      <a href="#" class="">home</a>
      <a href="#">origin</a>
      <a href="#">gear</a>
      <a href="#">villains</a>
      <a href="#">gallery</a>
      <a href="#">game</a>
    </nav>
    <div class="actions">
      <button class="grid-btn" id="menuBtn" aria-label="Open menu"><i><b></b><b></b><b></b><b></b></i></button>
      <a class="trailer" href="#" id="trailerBtn"><span>PLAY</span><span class="lbl-long">TRAILER</span></a>
    </div>
  </header>

  <div class="copy">
    <h1 class="rise d1"><span>Unplug</span><span>the hero</span></h1>
    <p class="sub rise d2">draw to reveal <em>→</em> powered by a normal kid</p>
  </div>

  <a class="card rise d4" href="#" aria-label="Season two: Voltline Overload">
    <img alt="" loading="eager" decoding="async"
         src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260930_025529_046b4b9a-5da8-48e9-89d6-42e85c35521a.png">
    <span class="badge">Season two</span>
    <div class="card-body">
      <h3>Voltline <br>Overload</h3>
      <p>the grid is going dark</p>
    </div>
  </a>

  <div class="foot-l rise d3">jay okoro · east grid</div>
  <div class="foot-r rise d3">voltline</div>

  <div class="loader" aria-hidden="true"><i></i></div>
</section>

<div class="menu" id="menu" aria-hidden="true">
  <button class="close" id="menuClose" aria-label="Close menu">✕</button>
  <a href="#">home</a><a href="#">origin</a><a href="#">gear</a><a href="#">villains</a><a href="#">gallery</a><a href="#">game</a>
</div>

<script>
(() => {
  const FRONT_SRC = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260930_032107_cf0bca78-1a51-492b-8607-1303fcc44eb7.png"; // transparent masked hero
  const BACK_SRC  = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260930_032109_4f2b4ad4-61bb-4a4a-8662-bdf3a12d757b.png"; // transparent unmasked kid, same framing

  const hero   = document.getElementById('hero');
  const bgEl   = document.getElementById('bg');
  const front  = document.getElementById('front');
  const fctx   = front.getContext('2d');
  const sparks = document.getElementById('sparks');
  const sctx   = sparks.getContext('2d');

  // reveal mask lives on a half-res offscreen canvas (it's soft, so no visible loss)
  const mask = document.createElement('canvas');
  const mctx = mask.getContext('2d');
  const MASK_SCALE = 0.5;

  // scratch canvas for "front minus brush"
  const tmp = document.createElement('canvas');
  const tctx = tmp.getContext('2d');

  const loadImg = src => { const i = new Image(); i.decoding = 'async'; i.src = src; return i; };
  const frontImg = loadImg(FRONT_SRC);
  const backImg  = loadImg(BACK_SRC);

  let W = 0, H = 0, DPR = 1, cover = {x:0,y:0,w:0,h:0};
  let brushR = 60;

  /* ── brush stamp: soft core with dry, bristly edges like the video's paint reveal ── */
  const brush = (() => {
    const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), R = S / 2;
    const rad = g.createRadialGradient(R, R, 0, R, R, R);
    rad.addColorStop(0, 'rgba(0,0,0,1)');
    rad.addColorStop(.5, 'rgba(0,0,0,.95)');
    rad.addColorStop(.78, 'rgba(0,0,0,.45)');
    rad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rad; g.fillRect(0, 0, S, S);
    // bristle streaks around the rim
    for (let i = 0; i < 220; i++) {
      const a = Math.random() * Math.PI * 2, d = R * (.55 + Math.random() * .42);
      const len = 6 + Math.random() * 22, w = .8 + Math.random() * 2.4;
      g.save(); g.translate(R + Math.cos(a) * d, R + Math.sin(a) * d); g.rotate(a + Math.PI / 2 + (Math.random() - .5) * .6);
      g.fillStyle = `rgba(0,0,0,${.15 + Math.random() * .5})`;
      g.beginPath(); g.ellipse(0, 0, w, len / 2, 0, 0, Math.PI * 2); g.fill(); g.restore();
    }
    // speckle holes → the dry-brush, patchy look
    g.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 140; i++) {
      const a = Math.random() * Math.PI * 2, d = R * (.35 + Math.random() * .6);
      g.fillStyle = `rgba(0,0,0,${.2 + Math.random() * .5})`;
      g.beginPath(); g.arc(R + Math.cos(a) * d, R + Math.sin(a) * d, .8 + Math.random() * 3.2, 0, Math.PI * 2); g.fill();
    }
    return c;
  })();

  /* ── layout: front + back hero share the exact same rect so they stay pixel-aligned
        (the background is a plain full-screen object-fit:cover image in CSS) ── */
  function layout() {
    const r = hero.getBoundingClientRect();
    W = r.width; H = r.height; DPR = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [front, sparks, tmp]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    mask.width = Math.max(1, Math.round(W * MASK_SCALE)); mask.height = Math.max(1, Math.round(H * MASK_SCALE));
    const iw = frontImg.naturalWidth || 2752, ih = frontImg.naturalHeight || 1536, ar = iw / ih;
    // landscape: classic cover. portrait: cap the zoom so the whole helmet fits,
    // anchor the plate to the bottom and let the dark sky above hold the headline.
    let w = Math.max(W, H * ar);
    if (W < H) w = Math.max(W, Math.min(H * ar, W * (W < 600 ? 2.3 : 1.9)));
    const h = w / ar;
    cover = { x: (W - w) / 2, y: h >= H ? (H - h) / 2 : H - h, w, h };
    brushR = Math.max(38, Math.min(W, H) * (W < 820 ? .11 : .075));
    dirty = true;
  }

  /* ── stroke points with a hold-then-heal lifetime ── */
  const pts = [];
  const HOLD = 650, FADE = 1100;
  let dirty = true;

  function stamp(x, y, r, ang) {
    pts.push({ x, y, r, ang, rot: Math.random() * Math.PI * 2, t: performance.now() });
    if (pts.length > 900) pts.splice(0, pts.length - 900);
  }

  let last = null;
  function paintTo(x, y, speedBoost = 1) {
    if (!last) { stamp(x, y, brushR, 0); last = { x, y }; return; }
    const dx = x - last.x, dy = y - last.y, dist = Math.hypot(dx, dy);
    if (dist < 1) return;
    const ang = Math.atan2(dy, dx);
    const r = brushR * Math.min(1.35, (.9 + dist / 180) * speedBoost);
    const step = Math.max(3, r * .22);
    const n = Math.ceil(dist / step);
    for (let i = 1; i <= n; i++) {
      const k = i / n;
      stamp(last.x + dx * k + (Math.random() - .5) * r * .12, last.y + dy * k + (Math.random() - .5) * r * .12, r * (.9 + Math.random() * .2), ang);
    }
    emitSparks(x, y, dx, dy, dist);
    last = { x, y };
  }

  function renderMask(now) {
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.clearRect(0, 0, mask.width, mask.height);
    mctx.setTransform(MASK_SCALE, 0, 0, MASK_SCALE, 0, 0);
    let alive = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], age = now - p.t;
      if (age > HOLD + FADE) continue;
      alive++;
      let a = age < HOLD ? 1 : 1 - (age - HOLD) / FADE;
      a = a * a * (3 - 2 * a); // smoothstep heal
      // the brush shrinks slightly as it heals, like paint drying back in
      const r = p.r * (age < HOLD ? 1 : .75 + .25 * a);
      mctx.globalAlpha = a;
      mctx.save(); mctx.translate(p.x, p.y); mctx.rotate(p.ang + p.rot * .15); mctx.scale(1.25, 1);
      mctx.drawImage(brush, -r, -r, r * 2, r * 2);
      mctx.restore();
    }
    mctx.globalAlpha = 1;
    // drop dead points
    let k = 0; while (k < pts.length && now - pts[k].t > HOLD + FADE) k++;
    if (k) pts.splice(0, k);
    return alive;
  }

  // hero = (back ∩ brush) + (front − brush). Where the brush passes over empty
  // space around the smaller head, the background and graffiti show through.
  function renderFront(now) {
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fctx.globalCompositeOperation = 'source-over';
    fctx.clearRect(0, 0, W, H);
    if (!pts.length) { fctx.drawImage(frontImg, cover.x, cover.y, cover.w, cover.h); return; }
    renderMask(now);
    // back, kept only inside the brush
    fctx.drawImage(backImg, cover.x, cover.y, cover.w, cover.h);
    fctx.globalCompositeOperation = 'destination-in';
    fctx.drawImage(mask, 0, 0, W, H);
    // front, with the brush cut out
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    tctx.globalCompositeOperation = 'source-over';
    tctx.clearRect(0, 0, W, H);
    tctx.drawImage(frontImg, cover.x, cover.y, cover.w, cover.h);
    tctx.globalCompositeOperation = 'destination-out';
    tctx.drawImage(mask, 0, 0, W, H);
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.globalCompositeOperation = 'source-over';
    fctx.drawImage(tmp, 0, 0);
  }

  /* ── electric sparks + micro-lightning along the stroke ── */
  const parts = [], bolts = [];
  function addBolt(x, y, a, len, m = 6) {
    const segs = [[x, y]];
    for (let i = 1; i <= m; i++) {
      x += Math.cos(a) * len / m + (Math.random() - .5) * len * .35;
      y += Math.sin(a) * len / m + (Math.random() - .5) * len * .35;
      segs.push([x, y]);
    }
    bolts.push({ segs, life: 1 });
  }
  // idle electricity around the collar and shoulders (the cutouts dropped the baked-in lightning)
  const COLLAR = [[.41, .70, -2.4], [.59, .70, -.7], [.36, .80, -2.8], [.64, .80, -.35], [.45, .66, -2.0], [.55, .66, -1.1]];
  function ambient() {
    if (Math.random() > .16) return;
    const [u, v, a] = COLLAR[(Math.random() * COLLAR.length) | 0];
    addBolt(cover.x + cover.w * u, cover.y + cover.h * v, a + (Math.random() - .5) * .9, cover.w * (.02 + Math.random() * .035), 5);
  }
  function emitSparks(x, y, dx, dy, dist) {
    const n = Math.min(6, Math.floor(dist / 10));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4.5;
      parts.push({ x, y, vx: Math.cos(a) * sp - dx * .03, vy: Math.sin(a) * sp - dy * .03, life: 1, decay: .025 + Math.random() * .04,
                   hue: Math.random() < .7 ? 195 : 262 });
    }
    if (Math.random() < Math.min(.5, dist / 90)) {
      const a = Math.random() * Math.PI * 2, len = brushR * (.7 + Math.random() * .9);
      addBolt(x + Math.cos(a) * brushR * .55, y + Math.sin(a) * brushR * .55, a, len);
    }
    if (parts.length > 500) parts.splice(0, parts.length - 500);
  }

  function renderSparks() {
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.clearRect(0, 0, W, H);
    if (!parts.length && !bolts.length) return false;
    sctx.globalCompositeOperation = 'lighter';
    sctx.lineCap = 'round';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      const ox = p.x, oy = p.y;
      p.x += p.vx; p.y += p.vy; p.vx *= .94; p.vy = p.vy * .94 + .05; p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      sctx.strokeStyle = `hsla(${p.hue},100%,${62 + p.life * 20}%,${p.life})`;
      sctx.lineWidth = 1.6 * p.life + .4;
      sctx.beginPath(); sctx.moveTo(ox, oy); sctx.lineTo(p.x, p.y); sctx.stroke();
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i]; b.life -= .12;
      if (b.life <= 0) { bolts.splice(i, 1); continue; }
      sctx.shadowColor = 'rgba(53,211,255,.9)'; sctx.shadowBlur = 12;
      sctx.strokeStyle = `rgba(150,230,255,${b.life})`; sctx.lineWidth = 1.4;
      sctx.beginPath(); b.segs.forEach(([x, y], j) => j ? sctx.lineTo(x, y) : sctx.moveTo(x, y)); sctx.stroke();
      sctx.shadowBlur = 0;
    }
    sctx.globalCompositeOperation = 'source-over';
    return true;
  }

  /* ── main loop: only redraw the front while something is revealed ── */
  function tick(now) {
    if (dirty || pts.length) { renderFront(now); dirty = pts.length > 0; }
    ambient();
    renderSparks();
    requestAnimationFrame(tick);
  }

  /* ── input ── */
  const local = e => { const r = hero.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const isUI = el => !!(el && el.closest && el.closest('header, .card, .menu'));

  hero.addEventListener('pointermove', e => {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const onUI = isUI(e.target);
    // mouse reveals on hover; touch/pen reveal while dragging
    if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) {
      if (onUI && e.pointerType === 'mouse') { last = null; return; }
      for (const ev of evs) { const p = local(ev); paintTo(p.x, p.y); }
    }
  }, { passive: true });
  hero.addEventListener('pointerenter', () => { last = null; });
  hero.addEventListener('pointerleave', () => { last = null; });
  hero.addEventListener('pointerdown', e => {
    if (isUI(e.target)) return;
    last = null; const p = local(e); paintTo(p.x, p.y);
  });
  hero.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') last = null; });

  /* ── menu ── */
  const menu = document.getElementById('menu');
  const openMenu = v => { menu.classList.toggle('open', v); menu.setAttribute('aria-hidden', !v); };
  document.getElementById('menuBtn').addEventListener('click', () => openMenu(true));
  document.getElementById('menuClose').addEventListener('click', () => openMenu(false));
  menu.addEventListener('click', e => { if (e.target.tagName === 'A') openMenu(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') openMenu(false); });
  document.querySelectorAll('a[href="#"]').forEach(a => a.addEventListener('click', e => e.preventDefault()));

  /* ── boot: wait for both plates so they appear together ── */
  const loaded = img => img.complete && img.naturalWidth ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; });
  Promise.all([loaded(frontImg), loaded(backImg), loaded(bgEl), document.fonts ? document.fonts.ready : 0]).then(() => {
    layout();
    hero.classList.add('ready');
    requestAnimationFrame(tick);
  });
  new ResizeObserver(() => { if (frontImg.naturalWidth) layout(); }).observe(hero);
})();
</script>
</body>
</html>
